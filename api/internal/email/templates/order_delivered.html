<p style="margin:0 0 16px 0;font-size:16px;line-height:1.6;color:#1D1D1F;">สวัสดีคุณ{{name .Name}} พัสดุของคำสั่งซื้อ <strong>{{.Order.No}}</strong> ส่งถึงปลายทางแล้ว หวังว่าคุณจะชอบสินค้านะคะ</p>
{{with .Shipment}}{{template "parcel" .}}{{end}}
{{template "button" (btn .Order.URL "ดูคำสั่งซื้อ")}}
